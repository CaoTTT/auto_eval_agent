[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-eval-agent"
version = "0.1.0"
description = "自动评估 Agent：垂域视觉评测 / 垂域视觉对比评测的 Web 评估台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<1.1",
    "openai>=1.10",
    "tenacity>=8.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "tokenizers>=0.22,<0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_eval = ["tokenizer_data/*.gz", "tokenizer_data/*.txt", "tokenizer_data/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real external services and may consume model quota",
]
