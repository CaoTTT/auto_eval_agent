# 裁判配置（单轮直出：不联网、不调工具）
# 裁判按 SYSTEM/USER 模板一次生成 <analysis> + 结论 JSON；解析失败走定向修复（repair_json）。
judges:
  # —— 裁判2：终端用户（普通用户视角，Qwen3.5）——
  - name: judge_2
    display: 终端用户
    runner: openai_compat
    base_url: https://llm-62rq0bg4qrp2uy30.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: ALI
    model: qwen3.8-flash
    temperature: 0.1            # SiliconFlow Qwen 支持低温采样且复跑逐字一致（探针实测）
    seed: 42                  # 固定种子 + temperature=0 → 可复现，消除"时好时坏"
    persona: end_user
    concurrency: 3


endpoints:
  - name: zimoALI
    display: 子墨api
    base_url: https://llm-62rq0bg4qrp2uy30.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: ALI
  - name: xiaohangALI
    display: 潇航api
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: Lin

models:
  - qwen3.5-397b-a17b
  - qwen3.8-flash

