# 裁判配置（单轮直出：不联网、不调工具）
# 裁判按 SYSTEM/USER 模板一次生成 <analysis> + 结论 JSON；解析失败走定向修复（repair_json）。
judges:
  # —— 裁判2：终端用户（普通用户视角，Qwen3.5）——
  - name: judge_2
    display: 终端用户
    runner: openai_compat
    base_url: http://10.97.134.88:5162/v1
    api_key_env: Caigo
    model: qwen3.8-flash
    # 尽力减少同输入的输出波动；服务端计算、路由或模型更新仍可能产生差异。
    temperature: 0
    top_p: 1
    top_k: 1
    seed: 42
    frequency_penalty: 0
    n: 1
    # 两种裁判模型共用 64K 输出上限；视觉配置须预留相同输出空间。
    max_tokens: 65536
    enable_thinking: false
    persona: end_user
    concurrency: 3
    vl_high_resolution_images: true
    # 单次请求最多 30 分钟；连续 5 分钟没有流式数据才触发读取超时。
    total_timeout_s: 1800
    read_timeout_s: 300


default_judge_model_profile: bailian_qwen38_flash
