# 裁判配置（单轮直出：不联网、不调工具）
# 裁判按 SYSTEM/USER 模板一次生成 <analysis> + 结论 JSON；解析失败走定向修复（repair_json）。
judges:
  # —— 裁判2：终端用户（普通用户视角，Qwen3.5）——
  - name: judge_2
    display: 终端用户
    runner: openai_compat
    base_url: http://10.97.134.88:5162/v1
    api_key_env: Caigo
    model: qwen3.8-flash
    persona: end_user
    temperature: 0            # SiliconFlow Qwen 支持低温采样且复跑逐字一致（探针实测）
    seed: 42                  # 固定种子 + temperature=0 → 可复现，消除"时好时坏"
    concurrency: 3
    vl_high_resolution_images: true
    total_timeout_s: 300
    read_timeout_s: 90


default_judge_model_profile: bailian_qwen38_flash
judge_model_profiles:
