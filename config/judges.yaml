# 裁判配置（单轮直出：不联网、不调工具）
# 裁判按 SYSTEM/USER 模板一次生成 <analysis> + 结论 JSON；解析失败走定向修复（repair_json）。
judges:
  # —— 裁判2：终端用户（普通用户视角，Qwen3.5）——
  - name: judge_2
    display: 终端用户
    runner: openai_compat
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICON_FLOW_API_KEY
    model: Qwen/Qwen3.5-397B-A17B
    # 尽力减少同输入的输出波动；服务端计算、路由或模型更新仍可能产生差异。
    temperature: 0
    top_p: 1
    top_k: 1
    seed: 42                  # 固定请求种子；SiliconFlow 文档未保证支持或逐字复现
    frequency_penalty: 0
    n: 1
    max_tokens: 8192
    enable_thinking: false
    persona: end_user
    concurrency: 3
